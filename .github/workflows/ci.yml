name: CI

# Runs on every push and pull request. The release workflow only fires on a
# tag, which is far too late to learn the tests are broken.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-cursor0

      - run: pip install -r requirements.txt pytest

      - name: Tests
        run: pytest -q

      # 3.9 is the documented floor. If the GUI stops importing there, the
      # README is lying and someone will find out the hard way.
      - name: Import and start the GUI
        env:
          QT_QPA_PLATFORM: offscreen
          AMBAAR_SELFTEST: "1"
        run: python main.py