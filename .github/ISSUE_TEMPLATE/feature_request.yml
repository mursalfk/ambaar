name: Feature request
description: Suggest something
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you hitting
      description: |
        Describe the situation, not the solution. Knowing what you were trying
        to do often points at a better fix than the one either of us had in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you would like it to do

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds, other tools, settings that nearly worked.
